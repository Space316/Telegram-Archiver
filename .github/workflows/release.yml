# Builds one self-contained executable per operating system and attaches them to
# a GitHub Release. Nothing is compiled on your machine: push a tag and GitHub's
# own Windows / Linux / macOS runners do the work.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# You can also start it by hand from the Actions tab (Run workflow).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: telegram-archiver-windows-amd64.exe
          - os: ubuntu-22.04
            asset: telegram-archiver-linux-amd64
          - os: macos-14
            asset: telegram-archiver-macos-arm64
          - os: macos-13
            asset: telegram-archiver-macos-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      # ubuntu-22.04 links against an older glibc than ubuntu-latest, so the
      # Linux binary also runs on older distros instead of dying with
      # "GLIBC_2.38 not found".
      - name: Build single-file executable
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --console \
            --clean \
            --noconfirm \
            --name archiver-build \
            --collect-submodules telethon \
            --collect-all prompt_toolkit \
            --collect-all questionary \
            --hidden-import cryptg \
            --hidden-import arabic_reshaper \
            --hidden-import bidi \
            --hidden-import pyfiglet \
            telegram_archiver.py

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/archiver-build.exe "out/${{ matrix.asset }}"
          else
            mv dist/archiver-build "out/${{ matrix.asset }}"
            chmod +x "out/${{ matrix.asset }}"
          fi
          ls -lh out

      # Sanity gate: the binary must actually boot and draw its banner. Catches a
      # missing hidden import before the release goes out, instead of after.
      - name: Smoke test
        shell: bash
        run: |
          cd out
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            output=$(echo "" | "./${{ matrix.asset }}" 2>&1)
          else
            output=$(echo "" | timeout 60 "./${{ matrix.asset }}" 2>&1)
          fi
          set -e
          echo "$output" | head -40
          echo "$output" | grep -qi "archiver" || {
            echo "::error::the binary did not start correctly"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - run: ls -lhR assets

      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: assets/*
          body: |
            Download the one file that matches your system, then run it. Nothing to install — Python and every library are already inside the file.

            | System | File |
            |---|---|
            | Windows 10/11 (64-bit) | `telegram-archiver-windows-amd64.exe` |
            | Linux (64-bit) | `telegram-archiver-linux-amd64` |
            | macOS (Apple Silicon) | `telegram-archiver-macos-arm64` |
            | macOS (Intel) | `telegram-archiver-macos-amd64` |

            **Windows** — double-click the `.exe`. If SmartScreen appears, choose *More info → Run anyway* (the file is unsigned, not malicious).
            **Linux / macOS** — `chmod +x telegram-archiver-*` then run it from a terminal. On macOS also run `xattr -d com.apple.quarantine telegram-archiver-*` once.

            `accounts/`, `downloads/` and `config.py` are created next to the executable, so keep it in its own folder.
